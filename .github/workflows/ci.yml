name: Development

on:
  push:
    branches: [main, feat/**, fix/**, chore/**]
  pull_request:

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-lint-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-lint-

      - name: Install Dependencies
        run: |
          cd electron-app
          npm install

      - name: Type Check
        run: |
          cd electron-app
          npm run typecheck

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-frontend-${{ hashFiles('electron-app/src/renderer/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-frontend-

      - name: Install Dependencies
        run: npm install
        working-directory: ./electron-app/src/renderer/

      - name: Build React
        run: npm run build
        working-directory: ./electron-app/src/renderer/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-frontend
          path: electron-app/out/renderer/

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-backend-${{ hashFiles('electron-app/src/main/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-backend-

      - name: Install Dependencies
        run: npm install
        working-directory: ./electron-app/src/main/

      - name: Build Main
        run: npm run build
        working-directory: ./electron-app/src/main/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-backend
          path: electron-app/out/main/

  package-app:
    name: Package App
    runs-on: ${{ matrix.os }}
    needs: [build-frontend, build-backend]
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-package-${{ hashFiles('electron-app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-package-

      - name: Download frontend build
        uses: actions/download-artifact@v3
        with:
          name: build-frontend
          path: electron-app/out/renderer/

      - name: Download backend build
        uses: actions/download-artifact@v3
        with:
          name: build-backend
          path: electron-app/out/main/

      - name: Install Dependencies
        run: npm install
        working-directory: ./electron-app

      - name: Build & Package
        run: |
          npm run build
          npm run package
        working-directory: ./electron-app

      - name: Upload packages
        uses: actions/upload-artifact@v3
        with:
          name: electron-app-${{ matrix.os }}
          path: electron-app/release/
