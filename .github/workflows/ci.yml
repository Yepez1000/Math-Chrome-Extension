name: Development

on:
  push:
    branches: [main, feat/**, fix/**, chore/**]
  pull_request:

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./electron-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-lint-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-lint-

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./electron-app/src/renderer

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-frontend-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-frontend-

      - name: Install Dependencies
        run: npm ci

      - name: Build React
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-frontend
          path: ../../../electron-app/out/renderer/

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./electron-app/src/main

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-backend-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-backend-

      - name: Install Dependencies
        run: npm ci

      - name: Build Main
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-backend
          path: ../../../electron-app/out/main/

  package-app:
    name: Package App
    runs-on: ${{ matrix.os }}
    needs: [build-frontend, build-backend]
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: ./electron-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-package-${{ hashFiles('electron-app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-package-

      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: build-frontend
          path: out/renderer

      - name: Download Backend Build
        uses: actions/download-artifact@v4
        with:
          name: build-backend
          path: out/main

      - name: Install Dependencies
        run: npm ci

      - name: Build & Package
        run: |
          npm run build
          npm run package

      - name: Upload App Packages
        uses: actions/upload-artifact@v4
        with:
          name: electron-app-${{ matrix.os }}
          path: release/
          