name: Development

on:
  push:
    branches: [main, feat/**, fix/**, chore/**]
  pull_request:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./electron-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './electron-app/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build React
        run: npm run build

      - name: Type Check
        run: npm run typecheck
          
